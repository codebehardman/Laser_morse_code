; Laser Morse code transceiver - PlatformIO project
;
;   pio run -e esp32 -t upload           flash the ESP32 over its USB port
;   pio run -e bluepill -t upload        flash an STM32F103 with an ST-LINK V2
;   pio run -e bluepill_uart -t upload   flash with a USB-serial adapter (BOOT0 = 1)
;   pio device monitor                   open the USB serial console
;   pio test -e native                   run the unit tests on your PC

[platformio]
default_envs = esp32

[env]
build_unflags = -std=gnu++11 -std=gnu++14
build_flags = -std=gnu++17 -Wall -Wextra

; ESP32-WROOM-32 DevKit: flashes and talks to the PC over its USB port.
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; STM32F103C8T6 board ("Blue Pill" style), 72 MHz, 64 KB flash, 20 KB RAM.
; The serial console runs over the chip's own USB port (USB CDC), so the
; board shows up as a virtual COM port when plugged into a PC.
[env:bluepill]
platform = ststm32
board = bluepill_f103c8
framework = arduino
build_flags = ${env.build_flags}
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
monitor_speed = 115200
upload_protocol = stlink
; Many F103C8T6 boards carry a compatible clone chip (CKS32/CS32/APM32)
; whose debug ID differs from ST's; this makes OpenOCD accept it.
upload_flags = -c set CPUTAPID 0

; Same firmware, flashed through the ROM serial bootloader with a USB-serial
; adapter on PA9/PA10 instead of an ST-LINK (see README).
[env:bluepill_uart]
extends = env:bluepill
upload_protocol = serial
upload_flags =

; Host-side unit tests for the hardware-independent libraries (lib/).
[env:native]
platform = native
test_framework = unity
