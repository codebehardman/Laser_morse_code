; Laser Morse code transceiver - PlatformIO project
;
;   pio run -e standalone -t upload    flash, wiring exactly as the schematic
;   pio run -e usb_serial -t upload    flash, with the USB serial console
;   pio device monitor -e usb_serial   open the serial console (115200 baud)
;   pio test -e native                 run the Morse unit tests on your PC

[platformio]
default_envs = standalone

[env]
build_unflags = -std=gnu++11 -std=gnu++14
build_flags = -std=gnu++17 -Wall -Wextra

[stm32]
platform = ststm32
board = nucleo_f401re
framework = arduino
upload_protocol = stlink
monitor_speed = 115200

; Wiring exactly as in the design-document schematic (button on PA2,
; buzzer on PA3). PA2/PA3 are the ST-LINK USB serial lines, so the serial
; console is disabled: key with the button, listen on the buzzer.
[env:standalone]
extends = stm32
build_flags = ${env.build_flags}
    -D LMC_USB_SERIAL=0

; Button moved to PA4 (A2) and buzzer to PB0 (A3), freeing PA2/PA3 for the
; USB serial console: send/receive text from a PC and run diagnostics.
[env:usb_serial]
extends = stm32
build_flags = ${env.build_flags}
    -D LMC_USB_SERIAL=1
    -D LMC_PIN_BUTTON=PA4
    -D LMC_PIN_BUZZER=PB0

; Host-side unit tests for the hardware-independent Morse library (lib/morse).
[env:native]
platform = native
test_framework = unity
