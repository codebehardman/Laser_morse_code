; Laser Morse code transceiver - PlatformIO project
;
;   pio run -e esp32 -t upload           flash the ESP32 over its USB port
;   pio device monitor                   open the serial console (115200 baud)
;   pio test -e native                   run the unit tests on your PC

[platformio]
default_envs = esp32

[env]
build_unflags = -std=gnu++11 -std=gnu++14
build_flags = -std=gnu++17 -Wall -Wextra

; ESP32-WROOM-32 DevKit: flashes and talks to the PC over its USB port.
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; 921600 corrupted uploads through the board's CH340 USB chip.
upload_speed = 460800
; Build time (YYYYMMDDhhmm), printed at startup so you can tell which
; firmware is running.
build_src_flags = !echo -DLMC_BUILD_ID=$(date +%%Y%%m%%d%%H%%M)

; Host-side unit tests for the hardware-independent libraries (lib/).
[env:native]
platform = native
test_framework = unity
